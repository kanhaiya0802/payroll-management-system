<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Employees</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>

<body>
  <div class="container" style="max-width: 1100px;">
    <div class="card">
      <h1 class="title">📋 Employees List</h1>
      <p class="subtitle">Admin only</p>

      <div style="margin-top: 14px;">
        <button class="btn" id="loadBtn">Load Employees</button>
        <p id="msg" class="msg"></p>
      </div>

      <div style="overflow:auto; margin-top:16px;">
        <table id="empTable" style="width:100%; border-collapse:collapse;">
          <thead>
            <tr style="text-align:left; color:#cbd5e1;">
              <th style="padding:10px;">ID</th>
              <th style="padding:10px;">Code</th>
              <th style="padding:10px;">Name</th>
              <th style="padding:10px;">Email</th>
              <th style="padding:10px;">Department</th>
              <th style="padding:10px;">Salary</th>
              <th style="padding:10px;">Action</th>
            </tr>
          </thead>
          <tbody id="empBody"></tbody>
        </table>
      </div>

      <div style="display:flex; gap:10px; margin-top:14px;">
        <a class="btn" href="admin_dashboard.html" style="text-decoration:none; text-align:center;">⬅ Back</a>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    requireAuth("admin");

    const loadBtn = document.getElementById("loadBtn");
    const empBody = document.getElementById("empBody");
    const msg = document.getElementById("msg");

    async function deleteEmployee(empId) {
      const ok = confirm("Are you sure you want to delete this employee?");
      if (!ok) return;

      try {
        await apiFetch(`/employees/${empId}`, { method: "DELETE" });
        alert("Employee deleted ✅");

        loadBtn.click();
      } catch (err) {
        alert(err.message);
      }
    }


    loadBtn.addEventListener("click", async () => {
      msg.textContent = "Loading...";
      msg.className = "msg";
      empBody.innerHTML = "";

      try {
        const employees = await apiFetch("/employees/", { method: "GET" });

        if (employees.length === 0) {
          msg.textContent = "No employees found.";
          msg.className = "msg error";
          return;
        }

        employees.forEach(emp => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td style="padding:10px; border-top:1px solid rgba(255,255,255,0.08);">${emp.id}</td>
            <td style="padding:10px; border-top:1px solid rgba(255,255,255,0.08);">${emp.emp_code}</td>
            <td style="padding:10px; border-top:1px solid rgba(255,255,255,0.08);">${emp.full_name}</td>
            <td style="padding:10px; border-top:1px solid rgba(255,255,255,0.08);">${emp.email}</td>
            <td style="padding:10px; border-top:1px solid rgba(255,255,255,0.08);">${emp.department ?? "-"}</td>
            <td style="padding:10px; border-top:1px solid rgba(255,255,255,0.08);">${emp.basic_salary}</td>
                  
            <td style="padding:10px; border-top:1px solid rgba(255,255,255,0.08);">
              <button class="btn" style="padding:8px 12px; font-size:13px; border-radius:12px;
                background: linear-gradient(135deg,#fb7185,#f97316);"
                onclick="deleteEmployee(${emp.id})">
                Delete
              </button>
            </td>
          `;

          empBody.appendChild(tr);
        });

        msg.textContent = `Loaded ${employees.length} employees ✅`;
        msg.className = "msg success";

      } catch (err) {
        msg.textContent = err.message;
        msg.className = "msg error";
      }
    });
  </script>
</body>
</html>
