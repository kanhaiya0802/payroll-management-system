<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payroll Management - Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>

  <div class="container">
    <div class="card">
      <h1 class="title">Payroll Management</h1>
      <p class="subtitle">Login to continue</p>
      <p style="text-align:center; margin-bottom:16px;">
        <span class="badge">Admin & Employee Portal</span>
      </p>


      <form id="loginForm" class="form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="Enter email" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter password" required />
        </div>

        <button type="submit" class="btn">Login</button>

        <p id="msg" class="msg"></p>
      </form>

      <div class="footer-note">
        <p>Admin & Employee Login supported ✅</p>
      </div>
      <p class="footer-note">© 2026 ABC Tech Pvt. Ltd. All rights reserved. </p>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
